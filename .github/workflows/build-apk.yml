# Put this file in your GitHub repo at: .github/workflows/build-apk.yml
# Then: Actions tab -> "Build APK" -> Run workflow. After ~5-10 minutes, open the finished run
# and download the "app-debug-apk" artifact (a zip containing the .apk) on your phone.
name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
